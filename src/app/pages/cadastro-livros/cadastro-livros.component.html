<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Livros</title>
    <link rel="stylesheet" href="cadastro-livros.component.css">
</head>

<body>
    <main>
        <form action="" id="cadastro-livro">
            <section id="section-cadastro">
                <div class="cadastro-container">
                    <div class="input-container">
                        <label for="titulo-input">Título: </label>
                        <input type="text" [(ngModel)]="livro.tituloLivro" name="titulo-input" id="titulo-input"
                            required>
                    </div>

                    <div class="input-container">
                        <label for="autor-input">Autor: </label>
                        <input type="text" [(ngModel)]="livro.autorLivro" name="autor-input" id="autor-input" required>
                    </div>

                    <div class="input-container">
                        <label for="genero">Gênero: </label>
                        <select id="genero" [(ngModel)]="livro.genero" name="genero" required>
                            <option value="Terror">Terror</option>
                            <option value="Romance">Romance</option>
                            <option value="Fantasia">Fantasia</option>
                            <option value="Suspense">Suspense</option>
                            <option value="Ficção">Ficção</option>
                        </select>
                    </div>

                    <div class="input-container">
                        <label for="desc-input">Descrição: </label>
                        <textarea name="description" [(ngModel)]="livro.descricao" id="desc-input" cols="20"
                            rows="5"></textarea>
                    </div>
                </div>
            </section>

            <section id="section-cadastro1">
                <div class="cadastro-container">
                    @if (livroId) {
                    <div class="input-container">
                        <label for="id-livro">ID: </label>
                        <input type="text" [(ngModel)]="livro.id" id="id-livro" name="id-livro" disabled>
                    </div>
                    }

                    <div class="input-container">
                        <label for="data">Data de lançamento: </label>
                        <input type="date" [(ngModel)]="livro.dataLancamento" id="data" name="data" required>
                    </div>

                    <div class="input-container">
                        <label for="quantidadePagina-input">Quantidade de páginas: </label>
                        <input type="text" [(ngModel)]="livro.qtdPagina" min="1" name="quantidadePagina-input"
                            id="quantidadePagina-input" required>
                    </div>

                    <div class="input-container">
                        <label for="preco-input">Preço do livro: </label>
                        <input type="text" [(ngModel)]="livro.precoLivro" name="preco-input" id="preco-input" required>
                    </div>

                    <div class="input-container">
                        <label for="imagem-input">Imagem do livro: </label>
                        <input type="text" [(ngModel)]="livro.imagemLivro" name="book-image" id="imagem-input" required>
                    </div>

                    <div id="cadastro-buttons">
                        <button type="button" (click)="cadastrarLivro()">Cadastrar</button>
                        <button type="reset">Limpar</button>
                        <button type="button" (click)="cadastrarLivro()">Atualizar</button>
                        <button type="button" (click)="excluirLivro(livro.id!)">Deletar</button>
                    </div>
                </div>
            </section>
        </form>
    </main>
</body>

</html>

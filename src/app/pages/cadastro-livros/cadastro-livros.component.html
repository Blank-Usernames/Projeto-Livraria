<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Livros</title>
    <link rel="stylesheet" href="cadastro-livros.component.css">
</head>

<body>
    <main>
        <form action="" id="cadastro-livro">
            <section id="section-cadastro">
                <div class="cadastro-container">
                    <div class="input-container">
                        <label for="titulo-input">Título: </label>
                        <input type="text" name="titulo-input" id="titulo-input" required>
                    </div>

                    <div class="input-container">
                        <label for="autor-input">Autor: </label>
                        <input type="text" name="autor-input" id="autor-input" required>
                    </div>

                    <div class="input-container">
                        <label for="genero">Gênero: </label>
                        <select id="genero" name="genero" required>
                            <option value="genero1">Gênero 1</option>
                            <option value="genero2">Gênero 2</option>
                            <option value="genero3">Gênero 3</option>
                        </select>
                    </div>

                    <div class="input-container">
                        <label for="desc-input">Descrição: </label>
                        <textarea name="description" id="desc-input" cols="20" rows="5"></textarea>
                    </div>
                </div>
            </section>

            <section id="section-cadastro1">
                <div class="cadastro-container">
                    <div class="input-container">
                        <label for="data">Data de lançamento: </label>
                        <input type="date" id="data" name="data" required>
                    </div>

                    <div class="input-container">
                        <label for="quantidadePagina-input">Quantidade de páginas: </label>
                        <input type="number" min="1" name="quantidadePagina-input" id="quantidadePagina-input" required>
                    </div>

                    <div class="input-container">
                        <label for="imagem-input">Imagem do livro: </label>
                        <input type="file" name="book-image" id="imagem-input" required>
                    </div>

                    <div id="cadastro-buttons">
                        <button type="submit">Cadastrar</button>
                        <button type="reset">Limpar</button>
                        <button type="button">Atualizar</button>
                    </div>
                </div>
            </section>
        </form>
    </main>
</body>

</html>

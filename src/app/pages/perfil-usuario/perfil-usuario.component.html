@if (mensagemPopup) {
<div class="popup" [class.popup-sucesso]="tipoPopup === 'sucesso'" [class.popup-aviso]="tipoPopup === 'aviso'"
    [class.popup-erro]="tipoPopup === 'erro'" role="status" aria-live="polite">
    <span class="popup-mensagem">{{ mensagemPopup }}</span>
</div>
}

<main>
    <section id="section-perfil">
        <div id="perfil-container">
            <form action="" id="perfil-usuario">
                <div class="section-title">
                    @if(modoAdmin) {
                    <h1>Perfil de {{ user.nomeUsuario }}</h1>
                    } @else {
                    <h1>Meu Perfil</h1>
                    }
                </div>

                <div class="input-container">
                    <label for="nome-input">Nome:</label>
                    <input type="text" [(ngModel)]="user.nomeUsuario" name="nome-input" id="nome-input" required
                        (keyup)="validarFormularioPerfil()">
                </div>

                <div class="input-container">
                    <label for="cpf-input">CPF:</label>
                    <input type="text" [(ngModel)]="user.cpf" name="cpf-input" id="cpf-input" readonly>
                </div>

                <div class="input-container">
                    <label for="email-input">E-mail:</label>
                    <input type="email" [(ngModel)]="user.email" name="email-input" id="email-input" required
                        (keyup)="validarFormularioPerfil()">
                </div>

                <div class="input-container">
                    <label for="senha-input">Senha:</label>
                    <input type="password" [(ngModel)]="user.senhaUsuario" name="senha-input" id="senha-input" required
                        (keyup)="validarFormularioPerfil()">
                </div>

                <div class="input-container">
                    <label for="confirmar-senha-input">Confirmar Senha:</label>
                    <input type="password" [(ngModel)]="confirmarSenha" name="confirmar-senha-input"
                        id="confirmar-senha-input" required (keyup)="validarFormularioPerfil()">
                </div>

                <section id="perfil-controllers">
                    <div id="perfil-buttons">
                        <button class="btn btn-primary" type="button" [disabled]="isDisabled"
                            (click)="atualizarPerfil()">Atualizar</button>
                        <button class="btn btn-secondary" routerLink="/catalogo" type="button">Cancelar</button>
                    </div>
                </section>
            </form>

            <hr>

            <section id="deletar-zone">
                <div id="deletar-container">
                    <div id="deletar-info">
                        <h2>Deletar Conta</h2>
                        <p>
                            A exclusão da conta é permanente e não poderá ser desfeita.
                            Todos os dados associados à sua conta serão removidos.
                        </p>
                        <div id="deletar-controllers">
                            <button class="btn btn-delete" (click)="excluirUsuario(user.id!)" type="button">Deletar
                                Conta</button>
                        </div>
                    </div>

                </div>
            </section>
        </div>
    </section>
</main>

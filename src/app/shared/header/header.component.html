<div class="posicao">
    <div class="TopoSecundario">
        <div class="MarcaSecundaria">Ars Libris</div>
        <nav>
            <ul>
                <li><a routerLink="/">Inicio</a></li>
                <li><a routerLink="/catalogo">Catálogo</a></li>
                <li><a routerLink="/ajuda-feedback">Ajuda</a></li>
                @if (isLogado) {
                <li><a routerLink="/cadastro-livros">Cadastrar Livro</a></li>
                } @else {

                }
            </ul>
        </nav>
    </div>


    <header>

        <div class="BarraPesquisa">
            <button type="submit" class="iconeBusca"><i class="fa-solid fa-magnifying-glass"></i></button>
            <input type="text" placeholder="Buscar Produtos...">
        </div>
        <div class="BlocoDireita">
            <nav class="acoesUsuarios">
                @if (!isLogado) {
                <ul>
                    <li>
                        <a routerLink="/cadastro-usuario">
                            <i class="fa-solid fa-user"></i>
                            Entrar
                        </a>
                    </li>
                    <li>
                        <a routerLink="/cadastro-usuario">/ Criar Conta</a>
                    </li>

                </ul>
                } @else {
                    <ul>
                    <li>
                        <a (click)="sair()">
                            <i class="fa-solid fa-user"></i>
                            Sair
                        </a>
                    </li>
                    <li>
                        <a routerLink="/perfil-usuario">/ Meu Perfil</a>
                    </li>

                </ul>
                }
            </nav>
            <div class="botaoCarrinho">
                <a routerLink="/carrinho" class="iconeCarrinho" aria-label="ver carrinho">
                    <i class="fa-sharp fa-solid fa-cart-shopping"></i>
                </a>
            </div>
        </div>

    </header>
</div>
